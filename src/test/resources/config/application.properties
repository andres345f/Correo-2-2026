# Solo para tests: se suma al application.properties principal y tiene prioridad.
# Los tests no deben leer ni borrar el buzon real, ni modificar el esquema de la BD.
app.mail.lectura-activa=false
spring.jpa.hibernate.ddl-auto=none
# Los logs de los tests no se mezclan con los del sistema real.
app.log.dir=target/test-logs
