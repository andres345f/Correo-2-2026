spring.application.name=unexo
# Las claves y datos de conexion viven en el archivo .env (raiz del proyecto),
# fuera del codigo. Una variable de entorno del sistema con el mismo nombre
# tiene prioridad sobre el .env (util en un servidor).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Dialecto fijo: sin esto Hibernate necesita conectarse para adivinarlo y la app
# NO arranca si la base de datos esta caida.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Si la BD no responde, rendirse a los 5 s (y no a los 30 por defecto) para
# avisarle rapido al usuario. Ninguna consulta puede tardar mas de 10 s.
spring.datasource.hikari.connection-timeout=5000
spring.jpa.properties.jakarta.persistence.query.timeout=10000


# ---------- ENVIO (SMTP) ----------
# El servidor de la facultad SOLO ofrece "AUTH CRAM-MD5" en el puerto 25 y ese
# login falla con esta cuenta. En cambio acepta el envio SIN autenticacion
# hacia direcciones @tecnoweb.org.bo. Por eso:
#   - auth=false
#   - NO se definen spring.mail.username / spring.mail.password: si estan
#     presentes, JavaMailSenderImpl intenta AUTH igual y revienta con
#     "No authentication mechanisms supported by both server and client".
# Timeouts para que la app no se quede colgada si el servidor no responde
# Si el servidor lo permite, las respuestas con tildes/ñ viajan tal cual (8bit)
# en vez de codificadas (=C3=B1), por si algun cliente no las decodifica

# ---------- LECTURA (POP3) y remitente ----------
app.mail.host=${MAIL_HOST}
app.mail.username=${MAIL_USERNAME}
app.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}

# Ver las consultas SQL en consola (ideal para depurar): poner en true.
# Queda en false para que la consola muestre solo los bloques de cada correo.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
# La app no tiene paginas web: evita el aviso de open-in-view al arrancar
spring.jpa.open-in-view=false

# ---------- Consola ----------
# De las librerias solo se muestran advertencias y errores; de nuestra app, todo
# (incluida la linea "Started UnexoApplication" que confirma que arranco).
# Para ver todo el detalle de arranque: logging.level.root=INFO
logging.level.root=WARN
logging.level.com.example.correo=INFO
# Hibernate repite en ingles cada error de BD; nuestros bloques ya muestran la causa
# real, asi que esos mensajes se apagan para que no ensucien la consola.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
logging.level.org.hibernate.orm.jdbc=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
app.admin.correo=${APP_ADMIN_CORREO:}
app.smtp.proveedor=${SMTP_PROVEEDOR:TECNOWEB}
# TECNOWEB (por defecto) o GOOGLE: leer los comandos de pop.gmail.com:995 con la
# misma cuenta SMTP_GMAIL_*. La cuenta debe tener POP habilitado en Gmail.
app.pop.proveedor=${POP_PROVEEDOR:TECNOWEB}
app.smtp.puerto=${SMTP_PUERTO:25}
app.smtp.gmail.user=${SMTP_GMAIL_USER:}
app.smtp.gmail.app-password=${SMTP_GMAIL_APP_PASSWORD:}
app.pagofacil.base-url=${PAGOFACIL_BASE_URL:https://masterqr.pagofacil.com.bo/api/services/v2}
app.pagofacil.token-service=${PAGOFACIL_TOKEN_SERVICE:}
app.pagofacil.token-secret=${PAGOFACIL_TOKEN_SECRET:}
app.pagofacil.callback-url=${PAGOFACIL_CALLBACK_URL:}

# ---------- Archivos de log (access.log y error.log) ----------
# Ver logback-spring.xml. Por defecto en la carpeta logs/ junto al proyecto.
app.log.dir=${APP_LOG_DIR:logs}
